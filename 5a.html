<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Oficial 2 - Lista de Exercícios</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-tema: #005aa0;
            --azul-claro: #ebf5ff;
            --cor-fundo: #f4f7f6;
            --cor-texto: #333;
            --cor-borda: #ccc;
            --cor-errado: #ffebee;
            --cor-errado-borda: #f44336;
            --cor-correto: #e8f5e9;
            --cor-correto-borda: #4caf50;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--azul-tema);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        header h2 {
            margin: 0.5rem 0 0;
            font-size: 1.2rem;
            font-weight: normal;
            color: var(--azul-claro);
        }

        header p {
            margin: 1rem 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .question-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .question-header {
            background-color: var(--azul-tema);
            color: white;
            padding: 1rem 1.5rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .question-body {
            padding: 1.5rem;
        }

        .enunciado {
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
        }

        .enunciado ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        /* Tabelas */
        .tabela-contabil {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .tabela-contabil th, .tabela-contabil td {
            border: 1px solid var(--cor-borda);
            padding: 8px;
            text-align: center;
        }

        .tabela-contabil th {
            background-color: var(--azul-claro);
            color: var(--azul-tema);
        }

        .tabela-contabil .left-align {
            text-align: left;
        }

        .tabela-contabil .right-align {
            text-align: right;
        }

        /* Alternativas */
        .alternativas {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .alternativa-btn {
            background-color: #fff;
            border: 1px solid var(--cor-borda);
            border-radius: 4px;
            padding: 1rem;
            text-align: left;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alternativa-btn:hover {
            background-color: var(--azul-claro);
            border-color: var(--azul-tema);
        }

        .letra-alt {
            font-weight: bold;
            color: var(--azul-tema);
            min-width: 25px;
        }

        .alternativa-btn.selected-wrong {
            background-color: var(--cor-errado);
            border-color: var(--cor-errado-borda);
        }

        .alternativa-btn.selected-correct {
            background-color: var(--cor-correto);
            border-color: var(--cor-correto-borda);
        }

        /* Feedback */
        .feedback-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background-color: var(--cor-correto);
            border-left: 5px solid var(--cor-correto-borda);
            color: #2e7d32;
        }

        .feedback-box.wrong {
            background-color: var(--cor-errado);
            border-left: 5px solid var(--cor-errado-borda);
            color: #c62828;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Preparação para a Avaliação Oficial 2</h1>
        <h2>Lista de Exercícios e Resoluções Detalhadas</h2>
        <p>Prof. Felipe Heitmann - Faculdade Anhanguera</p>
    </header>

    <div class="container" id="quiz-container">
        <!-- As questões serão injetadas aqui pelo JavaScript -->
    </div>

    <script>
        const questoes = [
            {
                id: 1,
                enunciado: `As empresas usam dois sistemas básicos para controlar estoques: o periódico e o permanente.<br><br>Qual é a principal desvantagem do sistema de <strong>inventário periódico</strong> no controle das mercadorias?`,
                alternativas: [
                    { texto: "Exige programas de computador caros para dar baixa em cada venda realizada.", correta: false, justificativa: "Incorreto. Essa é uma característica atribuída ao sistema permanente (que exige controle em tempo real), não ao periódico." },
                    { texto: "Não permite saber o saldo exato do estoque sem fazer uma contagem física.", correta: true, justificativa: "Correto! No sistema de inventário periódico, as vendas são registradas sem dar baixa imediata no estoque. A empresa é obrigada a 'fechar' fazendo a contagem física (inventário) das mercadorias no fim do período para descobrir qual é o Estoque Final real." },
                    { texto: "Impede o contador de calcular o Custo das Mercadorias Vendidas (CMV) no fim do ano.", correta: false, justificativa: "Incorreto. O contador calcula sim o CMV no sistema periódico, mas utilizando a fórmula: CMV = Estoque Inicial + Compras - Estoque Final." },
                    { texto: "Avalia as saídas de estoque usando apenas o preço de venda, ignorando o custo.", correta: false, justificativa: "Incorreto. As saídas nunca ignoram o preço de custo na apuração do resultado. No fechamento do periódico, o custo é devidamente apurado pela equação." },
                    { texto: "Obriga a empresa a usar o método UEPS, que é restrito pela Receita Federal.", correta: false, justificativa: "Incorreto. O sistema periódico não obriga o uso do UEPS (que de fato é vedado pela Receita Federal para fins de IR)." }
                ]
            },
            {
                id: 2,
                enunciado: `Os métodos PEPS (Primeiro que Entra, Primeiro que Sai), UEPS e Média Ponderada geram resultados diferentes no balanço, dependendo dos preços.<br><br>Sobre as características e regras desses métodos, assinale a alternativa CORRETA:`,
                alternativas: [
                    { texto: "O UEPS é o método mais aceito pela lei brasileira, pois reflete o custo atual de reposição.", correta: false, justificativa: "Incorreto. O UEPS é vedado (proibido) no Brasil pela legislação fiscal para apuração do Imposto de Renda." },
                    { texto: "No PEPS, o Estoque Final reflete o custo das compras mais recentes, ficando próximo ao valor de mercado atual.", correta: true, justificativa: "Correto! No método PEPS, as mercadorias vendidas (baixas) são valorizadas pelo custo dos lotes mais antigos. O que sobra na prateleira (o Estoque Final) são exatamente os lotes mais novos, cujos custos estão próximos aos do mercado atual." },
                    { texto: "A Média Ponderada exige calcular o custo apenas no final do ano, ignorando a ordem das compras mensais.", correta: false, justificativa: "Incorreto. A Média Ponderada *Móvel* (usada no sistema permanente) exige o recálculo do custo a cada nova compra registrada na ficha." },
                    { texto: "O PEPS garante que os últimos produtos comprados sejam os primeiros vendidos, evitando produtos vencidos.", correta: false, justificativa: "Incorreto. O PEPS faz o oposto: os *primeiros* produtos comprados (antigos) são os primeiros vendidos. O que a alternativa descreve é a mecânica do UEPS." },
                    { texto: "A escolha do método afeta apenas o Balanço Patrimonial, sem alterar o Lucro na DRE.", correta: false, justificativa: "Incorreto. A escolha do método afeta o valor do Estoque Final (Balanço) e, simultaneamente, afeta o valor do CMV apurado, o que muda diretamente o Lucro na DRE." }
                ]
            },
            {
                id: 3,
                enunciado: `Veja o histórico do estoque de uma empresa em março:
                <ul>
                    <li><strong>01/03:</strong> Estoque inicial de 10 itens a R$ 20,00 cada.</li>
                    <li><strong>04/03:</strong> Compra de 30 itens a R$ 30,00 cada.</li>
                    <li><strong>10/03:</strong> Venda de 15 itens por R$ 60,00 cada (preço de venda).</li>
                </ul>
                Pelo método da <strong>Média Ponderada Móvel</strong>, qual o custo unitário registrado na saída do dia 10/03?`,
                alternativas: [
                    { texto: "R$ 20,00.", correta: false, justificativa: "Incorreto. Este é apenas o valor do lote inicial. Na média móvel os valores devem ser ponderados." },
                    { texto: "R$ 25,00.", correta: false, justificativa: "Incorreto. R$ 25 seria uma média simples entre 20 e 30, mas o cálculo deve considerar as quantidades (ponderada)." },
                    { texto: "R$ 27,50.", correta: true, justificativa: "Correto! Saldo em 01/03: 10 unid × R$ 20 = R$ 200. Compra 04/03: 30 unid × R$ 30 = R$ 900. Total financeiro: R$ 1.100. Total físico: 40 peças. Custo Médio: R$ 1.100 ÷ 40 = R$ 27,50. A saída usa este custo médio." },
                    { texto: "R$ 28,33.", correta: false, justificativa: "Incorreto. O cálculo exato financeiro / quantidades (1100 / 40) resulta em exatamente R$ 27,50." },
                    { texto: "R$ 30,00.", correta: false, justificativa: "Incorreto. Este é apenas o valor do último lote comprado, o que seria usado no UEPS, mas não na Média Ponderada." }
                ]
            },
            {
                id: 4,
                enunciado: `Movimentação de mercadorias da Loja Alpha em abril:
                <ul>
                    <li><strong>01/04:</strong> Saldo inicial de 20 unidades a R$ 12,00 cada.</li>
                    <li><strong>05/04:</strong> Compra de 10 unidades a R$ 18,00 cada.</li>
                    <li><strong>12/04:</strong> Venda de 25 unidades.</li>
                </ul>
                Usando o método <strong>PEPS (Primeiro que Entra, Primeiro que Sai)</strong>, qual é o Custo das Mercadorias Vendidas (CMV) no dia 12/04?`,
                alternativas: [
                    { texto: "R$ 300,00.", correta: false, justificativa: "Incorreto. Lembre-se de aplicar a regra PEPS: esgotar os 20 itens mais antigos antes de usar os novos." },
                    { texto: "R$ 330,00.", correta: true, justificativa: "Correto! A venda de 25 unidades exige tirar primeiro o lote antigo: 20 unid × R$ 12 = R$ 240. Faltam 5 unidades, que saem do lote novo: 5 unid × R$ 18 = R$ 90. CMV = 240 + 90 = R$ 330,00." },
                    { texto: "R$ 390,00.", correta: false, justificativa: "Incorreto. Esse seria o resultado aproximado usando UEPS ou se calculasse errado a ordem dos lotes." },
                    { texto: "R$ 420,00.", correta: false, justificativa: "Incorreto. Revise a conta: 20 unidades a 12 reais (240) + 5 unidades a 18 reais (90)." },
                    { texto: "R$ 450,00.", correta: false, justificativa: "Incorreto. Este valor assume vender as 25 peças a 18 reais, o que não reflete a realidade do PEPS." }
                ]
            },
            {
                id: 5,
                enunciado: `A equação do inventário periódico é:<br><br>
                <strong>CMV = Estoque Inicial + Compras Líquidas - Estoque Final</strong><br><br>
                Sem fazer cálculos numéricos, assinale a alternativa que interpreta corretamente essa fórmula:`,
                alternativas: [
                    { texto: "Se o Estoque Final for menor que o Estoque Inicial, a empresa teve lucro operacional garantido.", correta: false, justificativa: "Incorreto. Um Estoque Final menor que o Inicial indica apenas que se vendeu mais mercadoria do que se comprou. Lucro depende do preço de venda cobrado comparado a esse custo." },
                    { texto: "Se o Estoque Final for zero, o CMV será igual a todas as mercadorias que estavam disponíveis (EI + Compras).", correta: true, justificativa: "Correto! Se EF = 0, a fórmula vira CMV = (EI + Compras) - 0. Ou seja, se não sobrou nada na prateleira, significa que absolutamente tudo o que estava disponível foi vendido e transformou-se em Custo (CMV)." },
                    { texto: "Um aumento nas Compras do mês sempre diminui o valor do CMV.", correta: false, justificativa: "Incorreto. Pela equação (CMV = EI + Compras - EF), as compras somam na equação. Aumentar as compras tende a aumentar o custo se o EF for constante." },
                    { texto: "O valor numérico do CMV é exatamente igual ao preço de venda cobrado do cliente na prateleira.", correta: false, justificativa: "Incorreto. CMV reflete o custo de aquisição/produção. O preço da prateleira é a Receita de Venda (que inclui a margem de lucro)." },
                    { texto: "Se os estoques inicial e final forem iguais, o CMV será zero, independentemente de quantas compras ocorreram.", correta: false, justificativa: "Incorreto. Se EI = EF, eles se anulam na fórmula. Assim, o CMV será exatamente igual ao valor das Compras." }
                ]
            },
            {
                id: 6,
                enunciado: `A tabela a seguir é uma ficha de estoque. Considere: H (histórico), C (compra), V (venda) e S.I. (saldo inicial).<br><br>
                <table class="tabela-contabil">
                    <tr><th>Data</th><th>H</th><th colspan="2">Entrada</th><th colspan="2">Saída</th><th colspan="2">Saldo</th></tr>
                    <tr><th></th><th></th><th>Qtd</th><th>Unit.</th><th>Qtd</th><th>Unit.</th><th>Qtd</th><th>Unit.</th></tr>
                    <tr><td>01/05</td><td>S.I.</td><td></td><td></td><td></td><td></td><td>30</td><td>10,00</td></tr>
                    <tr><td>04/05</td><td>C</td><td>50</td><td>15,00</td><td></td><td></td><td>30<br>50</td><td>10,00<br>15,00</td></tr>
                    <tr><td>09/05</td><td>C</td><td>20</td><td>20,00</td><td></td><td></td><td>30<br>50<br>20</td><td>10,00<br>15,00<br>20,00</td></tr>
                    <tr><td>15/05</td><td>V</td><td></td><td></td><td>20<br>40</td><td>20,00<br>15,00</td><td>30<br>10</td><td>10,00<br>15,00</td></tr>
                </table>
                <br>Analisando como as saídas e os saldos foram registrados, especialmente no dia 15/05, qual método a empresa usou?`,
                alternativas: [
                    { texto: "PEPS (Primeiro que Entra, Primeiro que Sai).", correta: false, justificativa: "Incorreto. Se fosse PEPS, a saída de 60 unidades no dia 15/05 começaria consumindo as 30 peças velhas de R$ 10,00." },
                    { texto: "Média Ponderada Móvel.", correta: false, justificativa: "Incorreto. Na média móvel, o saldo seria mesclado num único valor unitário a cada entrada, e não haveria lotes separados (10, 15, 20)." },
                    { texto: "UEPS (Último que Entra, Primeiro que Sai).", correta: true, justificativa: "Correto! Observe a coluna de Saída do dia 15/05. A empresa precisou tirar 60 peças. Ela começou tirando as 20 peças mais novas (de R$ 20,00) e completou com 40 peças do lote intermediário (R$ 15,00). Ou seja, tirou os 'Últimos a entrar'." },
                    { texto: "Inventário Periódico.", correta: false, justificativa: "Incorreto. A manutenção de uma ficha de controle de lote após lote em cada operação caracteriza Inventário Permanente." },
                    { texto: "Custo Específico de Lote.", correta: false, justificativa: "Incorreto. A característica sistemática de consumir sempre os últimos lotes caracteriza a metodologia UEPS." }
                ]
            },
            {
                id: 7,
                enunciado: `A ficha de estoque abaixo usa rigorosamente o método <strong>PEPS (Primeiro que Entra, Primeiro que Sai)</strong>.<br><br>
                <table class="tabela-contabil">
                    <tr><th>Data</th><th>H</th><th colspan="2">Entrada</th><th colspan="2">Saída</th><th colspan="2">Saldo</th></tr>
                    <tr><th></th><th></th><th>Qtd</th><th>Unit.</th><th>Qtd</th><th>Unit.</th><th>Qtd</th><th>Unit.</th></tr>
                    <tr><td>01/06</td><td>S.I.</td><td></td><td></td><td></td><td></td><td>20</td><td>10,00</td></tr>
                    <tr><td>05/06</td><td>V</td><td></td><td></td><td>10</td><td>10,00</td><td>10</td><td>10,00</td></tr>
                    <tr><td>10/06</td><td>C</td><td>20</td><td>15,00</td><td></td><td></td><td>10<br>20</td><td>10,00<br>15,00</td></tr>
                    <tr><td>15/06</td><td>V</td><td></td><td></td><td>10<br>15</td><td>10,00<br>15,00</td><td>5</td><td>15,00</td></tr>
                </table>
                <br>Qual é o valor total do <strong>Custo das Mercadorias Vendidas (CMV)</strong> apurado no mês de junho inteiro (soma das saídas)?`,
                alternativas: [
                    { texto: "R$ 325,00.", correta: false, justificativa: "Incorreto. R$ 325,00 é o CMV apenas da venda do dia 15/06. A questão pede o do mês inteiro." },
                    { texto: "R$ 425,00.", correta: true, justificativa: "Correto! O CMV total é a soma financeira de todas as saídas: Venda do dia 05 (10 × R$ 10 = R$ 100,00) + Venda do dia 15 (10 × R$ 10 = R$ 100,00 E 15 × R$ 15 = R$ 225,00). Total: 100 + 100 + 225 = R$ 425,00." },
                    { texto: "R$ 400,00.", correta: false, justificativa: "Incorreto. O valor exato soma as parcelas listadas na coluna Saída." },
                    { texto: "R$ 350,00.", correta: false, justificativa: "Incorreto. Lembre-se de multiplicar a Qtd pelo Unitário de cada linha de saída e depois somar os resultados." },
                    { texto: "R$ 500,00.", correta: false, justificativa: "Incorreto. A soma financeira das saídas (CMV) é 425. R$ 500 não reflete as saídas da ficha." }
                ]
            },
            {
                id: 8,
                enunciado: `Eventos de vendas do mês de agosto:
                <ul>
                    <li><strong>01/08:</strong> Venda de 20 itens por R$ 50,00 cada.</li>
                    <li><strong>05/08:</strong> Compra de 30 itens por R$ 20,00 cada.</li>
                    <li><strong>10/08:</strong> Venda de 10 itens por R$ 60,00 cada.</li>
                    <li><strong>12/08:</strong> Cliente do dia 01 devolveu 5 itens.</li>
                    <li><strong>15/08:</strong> Desconto incondicional de R$ 50,00 dado na venda do dia 10.</li>
                </ul>
                Apurando o início da DRE, qual é a <strong>Receita Líquida de Vendas</strong> do período?`,
                alternativas: [
                    { texto: "R$ 1.000,00.", correta: false, justificativa: "Incorreto. A Receita Bruta é 1.600. Você precisa abater a devolução e o desconto incondicional desse valor." },
                    { texto: "R$ 1.300,00.", correta: true, justificativa: "Correto! Receita Bruta: (20 × R$ 50) + (10 × R$ 60) = 1.000 + 600 = R$ 1.600,00. Deduções: Devolução de 5 itens (5 × 50 = R$ 250,00) + Desconto Incondicional (R$ 50,00) = R$ 300,00 de deduções. Receita Líquida = 1.600 - 300 = R$ 1.300,00." },
                    { texto: "R$ 1.350,00.", correta: false, justificativa: "Incorreto. Você pode ter esquecido de deduzir o Desconto Incondicional de R$ 50,00." },
                    { texto: "R$ 1.550,00.", correta: false, justificativa: "Incorreto. O valor das devoluções não é de apenas 5 reais, são 5 itens que foram vendidos originalmente a 50 reais cada." },
                    { texto: "R$ 1.600,00.", correta: false, justificativa: "Incorreto. R$ 1.600,00 é a Receita Bruta. A questão pede a Receita Líquida (após deduções de devoluções e descontos)." }
                ]
            },
            {
                id: 9,
                enunciado: `<strong>Partidas Dobradas:</strong> O total de débitos deve sempre ser igual ao de créditos. Às vezes, usamos mais de duas contas para registrar um evento.<br><br>
                <strong>Situação:</strong> A empresa comprou um veículo de R$ 100.000,00. Pagou R$ 40.000,00 à vista pelo Banco, e financiou o saldo de R$ 60.000,00 (Financiamentos a Pagar).<br><br>
                Qual é o lançamento contábil correto para registrar essa compra?`,
                alternativas: [
                    { texto: "Débito em Veículos (100.000) | Crédito em Banco (40.000) e Crédito em Financiamentos a Pagar (60.000).", correta: true, justificativa: "Correto! O bem Veículos (Ativo) aumentou em 100k, logo recebe Débito. O saldo do Banco (Ativo) diminuiu em 40k, logo recebe Crédito. A obrigação Financiamentos (Passivo) aumentou em 60k, logo recebe Crédito. Total Débito (100k) = Total Crédito (40k + 60k)." },
                    { texto: "Débito em Veículos (100.000) | Crédito em Banco (100.000).", correta: false, justificativa: "Incorreto. Isso assumiria que todo o carro foi pago à vista, o que não reflete a parte financiada." },
                    { texto: "Débito em Financiamentos a Pagar (60.000) e Débito em Banco (40.000) | Crédito em Veículos (100.000).", correta: false, justificativa: "Incorreto. As naturezas estão completamente invertidas. Aumentar ativo = Débito. Diminuir ativo / Aumentar passivo = Crédito." },
                    { texto: "Crédito em Veículos (100.000) | Débito em Banco (40.000) e Débito em Financiamentos a Pagar (60.000).", correta: false, justificativa: "Incorreto. Ao creditar Veículos, a empresa estaria registrando a perda/venda de um veículo, não a compra." },
                    { texto: "Débito em Banco (40.000) e Débito em Veículos (60.000) | Crédito em Financiamentos a Pagar (100.000).", correta: false, justificativa: "Incorreto. Os valores estão trocados e a natureza do Banco está como se estivesse entrando dinheiro, quando na verdade ele saiu." }
                ]
            },
            {
                id: 10,
                enunciado: `<strong>Regra das Naturezas:</strong> Ativos (bens e direitos) aumentam com Débitos. Passivos (obrigações) aumentam com Créditos. Modificações ocorrem, por exemplo, ao pagar uma dívida.<br><br>
                <strong>Situação:</strong> A empresa pagou R$ 3.000,00 de uma duplicata a um fornecedor via transferência bancária.<br><br>
                Lembrando que queremos <strong>diminuir</strong> a dívida e <strong>diminuir</strong> o saldo no banco, qual o lançamento correto?`,
                alternativas: [

        const container = document.getElementById('quiz-container');

        // Letras para as alternativas
        const letras = ['a', 'b', 'c', 'd', 'e'];

        // Renderizar questões
        questoes.forEach((questao, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            // Header
            const header = document.createElement('div');
            header.className = 'question-header';
            header.innerText = `Questão ${questao.id < 10 ? '0'+questao.id : questao.id}`;
            card.appendChild(header);

            // Body
            const body = document.createElement('div');
            body.className = 'question-body';

            // Enunciado
            const enunciado = document.createElement('div');
            enunciado.className = 'enunciado';
            enunciado.innerHTML = questao.enunciado;
            body.appendChild(enunciado);

            // Container de alternativas
            const altsContainer = document.createElement('div');
            altsContainer.className = 'alternativas';

            // Box de Feedback (único por questão, atualizado dinamicamente)
            const feedbackBox = document.createElement('div');
            feedbackBox.className = 'feedback-box';
            feedbackBox.id = `feedback-${qIndex}`;

            questao.alternativas.forEach((alt, aIndex) => {
                const btn = document.createElement('button');
                btn.className = 'alternativa-btn';
                
                btn.innerHTML = `<span class="letra-alt">${letras[aIndex]})</span> <span>${alt.texto}</span>`;
                
                btn.onclick = () => handleAnswer(btn, altsContainer, feedbackBox, alt.correta, alt.justificativa);
                
                altsContainer.appendChild(btn);
            });

            body.appendChild(altsContainer);
            body.appendChild(feedbackBox);
            card.appendChild(body);
            container.appendChild(card);
        });

        // Lógica de resposta
        function handleAnswer(btnClicked, container, feedbackBox, isCorrect, justificativa) {
            // Remove as classes selected de todos os botoes desta questao
            const allBtns = container.querySelectorAll('.alternativa-btn');
            allBtns.forEach(b => {
                b.classList.remove('selected-wrong', 'selected-correct');
            });

            // Adiciona classe baseada em se ta certo ou errado
            if (isCorrect) {
                btnClicked.classList.add('selected-correct');
                feedbackBox.className = 'feedback-box show correct';
                feedbackBox.innerHTML = `<div class="feedback-title">✅ Resposta Correta!</div><div>${justificativa}</div>`;
            } else {
                btnClicked.classList.add('selected-wrong');
                feedbackBox.className = 'feedback-box show wrong';
                feedbackBox.innerHTML = `<div class="feedback-title">❌ Alternativa Incorreta</div><div>${justificativa}</div>`;
            }
        }
